<link rel="stylesheet" href="style.css?v=1.0.0-rc.3" />

<div class="asmp-shell">
  <div class="asmp-heading">
    <div>
      <h3 id="page-title"></h3>
      <p id="page-description" class="text-muted"></p>
    </div>
    <select
      id="ui-language"
      class="form-select asmp-language"
      aria-label="Settings language"
    >
      <option value="auto">Auto</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>

  <div id="status" class="alert alert-info">Loading settings…</div>
  <div id="settings"></div>
</div>

<script src="app.js?v=1.0.0"></script>
